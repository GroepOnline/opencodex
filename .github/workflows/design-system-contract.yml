name: Design-system contract
on:
  push:
    paths:
      - ".bun-version"
      - ".github/design-system.json"
      - ".github/design-system.yml"
      - ".github/workflows/design-system-contract.yml"
      - "gui/**"
  pull_request:
    paths:
      - ".bun-version"
      - ".github/design-system.json"
      - ".github/design-system.yml"
      - ".github/workflows/design-system-contract.yml"
      - "gui/**"
permissions:
  contents: read

concurrency:
  group: design-system-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on:
      group: chefgroep-ci-ephemeral
      labels: chefgroep-ci-oci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout pinned design-system validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GroepOnline/design-system
          ref: c5bd56088b4e58425440e816189759d0862eb2b9
          path: .design-system-validator
          persist-credentials: false
      - name: Validate consumer contract
        run: python3 .design-system-validator/scripts/validate-consumer-contract.py .github/design-system.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Design token drift gate
        run: |
          cd gui
          bun install --frozen-lockfile
          bun run lint:design-tokens
