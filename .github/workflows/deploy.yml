name: Deploy to chef-control-az-01

# Rolls a new opencodex version out to the live proxy on chef-control-az-01.
#
# Triggers:
#   - push of a `v*.*.*` tag  -> deploy that exact version (the "new version" path)
#   - workflow_dispatch       -> deploy a tag ref deliberately (the "after merge" path)
#
# The job runs on the self-hosted `deploy` runner (ocx-deploy-az-01), which is the Azure
# control host itself, so it can restart its own systemd service (chef has NOPASSWD sudo)
# and health-gate the result locally. No SSH keys cross hosts.
#
# Requires the runner to be registered on chef-control-az-01 (ocx-deploy-runner.service).
# The service checkout at DEPLOY_PATH is the same tree systemd executes.
# Historical UpCloud chef-control-01 runner is retired.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to deploy (e.g. v1.2.1). Must be an existing tag and must sit on origin/main."
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: ocx-deploy-az-01
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, deploy]
    timeout-minutes: 20
    env:
      DEPLOY_PATH: /opt/chef/services/opencodex
    steps:
      - name: Resolve deploy tag
        id: ref
        # The dispatch ref is delivered via an env var (not inline `${{ }}` interpolation)
        # so it is treated as data. Inline interpolation would let a value like
        # `v1.2.3$(whoami)` be command-substituted by the shell *before* the shape
        # guard below runs — an injection on the production deploy host.
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_REF" ]; then
            tag="$INPUT_REF"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            echo "::error::no tag resolved for deploy (ref=${GITHUB_REF})"
            exit 1
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-preview\.[0-9]+)?$ ]]; then
            echo "::error::ref '$tag' is not a valid deploy tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout ref
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Verify tag is on origin/main
        id: verify
        run: |
          set -euo pipefail
          tag="${{ steps.ref.outputs.tag }}"
          git fetch --force --tags origin
          if ! git merge-base --is-ancestor "refs/tags/$tag" "origin/main"; then
            echo "::error::tag $tag is not on origin/main — refusing to deploy an unmerged ref"
            exit 1
          fi
          echo "tag_sha=$(git rev-parse "refs/tags/$tag")" >> "$GITHUB_OUTPUT"
          echo "$tag is on origin/main ($(git rev-parse "refs/tags/$tag"))"

      - name: Require successful Cross-platform CI
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_SHA: ${{ steps.verify.outputs.tag_sha }}
        run: |
          set -euo pipefail
          ci_url="$(gh run list --workflow ci.yml --commit "$TAG_SHA" \
            --status success --limit 1 --json url --jq '.[0].url // ""')"
          if [ -z "$ci_url" ]; then
            echo "::error::No successful Cross-platform CI run for ${TAG_SHA}"
            gh run list --workflow ci.yml --commit "$TAG_SHA" --limit 5 || true
            exit 1
          fi
          echo "Cross-platform CI passed: ${ci_url}"

      - name: Capture pre-deploy HEAD (for rollback)
        id: prev
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Refuse dirty live checkout or dropped commits
        id: live_guard
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::live checkout is dirty; refusing force checkout (would drop unpublished work)"
            exit 1
          fi
          tag_sha="${{ steps.verify.outputs.tag_sha }}"
          if ! git merge-base --is-ancestor HEAD "$tag_sha"; then
            echo "::error::live HEAD is not an ancestor of $tag_sha (would drop live-only commits)"
            exit 1
          fi

      - name: Resolve health URLs
        env:
          EXPECTED_VERSION: ${{ steps.ref.outputs.version }}
        run: |
          set -euo pipefail
          CONFIG="$HOME/.opencodex/config.json"
          if [ ! -f "$CONFIG" ]; then
            echo "::error::missing ${CONFIG} — refusing deploy before live checkout mutation"
            exit 1
          fi
          read -r port hostname <<< "$(python3 -c "
          import json, os
          cfg = json.load(open(os.path.expanduser('~/.opencodex/config.json')))
          port = int(cfg.get('port', 10100))
          hostname = (cfg.get('hostname') or '127.0.0.1').strip()
          print(f'{port} {hostname}')
          ")"
          health_urls="http://${hostname}:${port}/healthz"
          base_urls="http://${hostname}:${port}"
          if [ "$hostname" != "127.0.0.1" ]; then
            health_urls="$health_urls http://127.0.0.1:${port}/healthz"
            base_urls="$base_urls http://127.0.0.1:${port}"
          fi
          ts_ip="$(tailscale ip -4 2>/dev/null | head -n1 || true)"
          if [ -n "$ts_ip" ] && [ "$ts_ip" != "$hostname" ]; then
            health_urls="$health_urls http://${ts_ip}:${port}/healthz"
            base_urls="$base_urls http://${ts_ip}:${port}"
          fi
          echo "OCX_HEALTH_URLS=$health_urls" >> "$GITHUB_ENV"
          echo "OCX_BASE_URLS=$base_urls" >> "$GITHUB_ENV"
          echo "OCX_EXPECTED_VERSION=$EXPECTED_VERSION" >> "$GITHUB_ENV"

      - name: Deploy into service checkout (in-place, pinned SHA)
        id: deploy
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          git fetch --force --tags origin
          git checkout --force "${{ steps.verify.outputs.tag_sha }}"
          git reset --hard "${{ steps.verify.outputs.tag_sha }}"
          deployed_sha="$(git rev-parse HEAD)"
          echo "deployed_sha=$deployed_sha" >> "$GITHUB_OUTPUT"
          if [ "$deployed_sha" != "${{ steps.verify.outputs.tag_sha }}" ]; then
            echo "::error::deploy checkout SHA mismatch (${deployed_sha} != ${{ steps.verify.outputs.tag_sha }})"
            exit 1
          fi

      - name: Setup Node for Vite
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.12.0"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies (in service checkout)
        working-directory: ${{ env.DEPLOY_PATH }}
        run: bun install --frozen-lockfile

      - name: Build GUI (in service checkout)
        working-directory: ${{ env.DEPLOY_PATH }}
        run: bun run build:gui

      - name: Restart opencodex-proxy
        run: sudo systemctl restart opencodex-proxy.service

      - name: L1 process gate
        id: l1_process
        run: |
          set -euo pipefail
          if ! sudo systemctl is-active --quiet opencodex-proxy.service; then
            echo "::error::opencodex-proxy.service is not active after restart"
            sudo systemctl status opencodex-proxy.service --no-pager || true
            exit 1
          fi
          main_pid="$(sudo systemctl show -p MainPID --value opencodex-proxy.service)"
          if [[ ! "$main_pid" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::opencodex-proxy.service has no live MainPID"
            exit 1
          fi
          echo "main_pid=$main_pid" >> "$GITHUB_OUTPUT"
          echo "L1 process gate passed (MainPID=$main_pid)"

      - name: L2 service health gate
        id: health
        run: |
          set -euo pipefail
          main_pid="${{ steps.l1_process.outputs.main_pid }}"
          deadline=$((SECONDS + 60))
          attempt=0
          while (( SECONDS < deadline )); do
            attempt=$((attempt + 1))
            for url in $OCX_HEALTH_URLS; do
              remaining=$((deadline - SECONDS))
              (( remaining > 0 )) || break 2
              max_time=$((remaining < 2 ? remaining : 2))
              body="$(curl -fsS --max-time "$max_time" "$url" || true)"
              if HEALTH_BODY="$body" MAIN_PID="$main_pid" EXPECTED_VERSION="$OCX_EXPECTED_VERSION" python3 -c '
          import json, os, sys
          b = json.loads(os.environ["HEALTH_BODY"])
          ok = (
            b.get("status") == "ok"
            and b.get("service") == "opencodex"
            and str(b.get("pid")) == os.environ["MAIN_PID"]
            and str(b.get("version")) == os.environ["EXPECTED_VERSION"]
          )
          sys.exit(0 if ok else 1)
          ' 2>/dev/null; then
                echo "L2 healthy after ${attempt} tries via $url (pid=$main_pid version=$OCX_EXPECTED_VERSION)"
                base_url="${url%/healthz}"
                echo "status=ok" >> "$GITHUB_OUTPUT"
                echo "base_url=$base_url" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
            (( SECONDS < deadline )) && sleep 1
          done
          echo "::error::opencodex did not become identity-verified healthy within 60s after restart"
          exit 1

      - name: L3 dependencies gate
        id: l3_dependencies
        env:
          BASE_URL: ${{ steps.health.outputs.base_url }}
        run: |
          set -euo pipefail
          token_file="$HOME/.opencodex/admin-api-token"
          if [ ! -f "$token_file" ]; then
            echo "::error::missing admin-api-token for L3 management probes"
            exit 1
          fi
          ADMIN_TOKEN="$(tr -d '\n\r' < "$token_file")"
          auth_hdr="Authorization: Bearer ${ADMIN_TOKEN}"
          startup_body="$(curl -fsS --max-time 10 -H "$auth_hdr" "${BASE_URL}/api/startup-health" || true)"
          if ! printf '%s' "$startup_body" | python3 -c 'import json,sys; b=json.load(sys.stdin); sys.exit(0 if b.get("serviceRunning") is True else 1)' 2>/dev/null; then
            echo "::error::L3 /api/startup-health did not report serviceRunning=true"
            exit 1
          fi
          providers_body="$(curl -fsS --max-time 10 -H "$auth_hdr" "${BASE_URL}/api/providers" || true)"
          if ! printf '%s' "$providers_body" | python3 -c 'import json,sys; b=json.load(sys.stdin); sys.exit(0 if isinstance(b, list) and len(b) > 0 else 1)' 2>/dev/null; then
            echo "::error::L3 /api/providers did not return a non-empty provider list"
            exit 1
          fi
          echo "L3 dependencies gate passed"

      - name: L4 product gate
        id: l4_product
        env:
          BASE_URL: ${{ steps.health.outputs.base_url }}
        run: |
          set -euo pipefail
          token_file="$HOME/.opencodex/admin-api-token"
          ADMIN_TOKEN="$(tr -d '\n\r' < "$token_file")"
          auth_hdr="Authorization: Bearer ${ADMIN_TOKEN}"
          dashboard="$(curl -fsS --max-time 10 "${BASE_URL}/" || true)"
          if ! printf '%s' "$dashboard" | grep -Fq '<title>opencodex · proxy dashboard</title>'; then
            echo "::error::L4 dashboard HTML missing expected title (GUI build not served)"
            exit 1
          fi
          if ! printf '%s' "$dashboard" | grep -Fq 'src="/assets/'; then
            echo "::error::L4 dashboard HTML missing bundled asset references"
            exit 1
          fi
          config_body="$(curl -fsS --max-time 10 -H "$auth_hdr" "${BASE_URL}/api/config" || true)"
          if ! CONFIG_BODY="$config_body" EXPECTED_VERSION="$OCX_EXPECTED_VERSION" python3 -c '
          import json, os, sys
          b = json.load(os.environ["CONFIG_BODY"])
          pkg = json.load(open("/opt/chef/services/opencodex/package.json"))
          sys.exit(0 if str(pkg.get("version")) == os.environ["EXPECTED_VERSION"] else 1)
          ' 2>/dev/null; then
            echo "::error::L4 /api/config package version mismatch vs deploy tag"
            exit 1
          fi
          api_key="$(python3 -c "
          import json, os
          cfg = json.load(open(os.path.expanduser('~/.opencodex/config.json')))
          keys = cfg.get('apiKeys') or []
          if keys and isinstance(keys[0], dict):
              print(keys[0].get('key', ''))
          " 2>/dev/null || true)"
          if [ -z "$api_key" ]; then
            echo "::warning::L4 skipping /v1/models smoke — no data-plane apiKeys entry in config"
          else
            models_code="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${api_key}" "${BASE_URL}/v1/models" || true)"
            if [ "$models_code" != "200" ]; then
              echo "::error::L4 /v1/models returned HTTP ${models_code}"
              exit 1
            fi
          fi
          echo "L4 product gate passed"

      - name: Rollback on failure
        if: failure() && steps.prev.outcome == 'success' && steps.live_guard.outcome == 'success' && steps.deploy.outcome == 'success'
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          git checkout --force "${{ steps.prev.outputs.sha }}"
          git reset --hard "${{ steps.prev.outputs.sha }}"
          bun install --frozen-lockfile
          bun run build:gui
          sudo systemctl restart opencodex-proxy.service
          urls="${OCX_HEALTH_URLS:-http://127.0.0.1:10100/healthz}"
          if [ -z "${OCX_HEALTH_URLS:-}" ]; then
            CONFIG="$HOME/.opencodex/config.json"
            if [ -f "$CONFIG" ]; then
              read -r port hostname <<< "$(python3 -c "
              import json, os
              cfg = json.load(open(os.path.expanduser('~/.opencodex/config.json')))
              port = int(cfg.get('port', 10100))
              hostname = (cfg.get('hostname') or '127.0.0.1').strip()
              print(f'{port} {hostname}')
              ")"
              urls="http://${hostname}:${port}/healthz http://127.0.0.1:${port}/healthz"
            fi
            ts_ip="$(tailscale ip -4 2>/dev/null | head -n1 || true)"
            [ -z "$ts_ip" ] || urls="$urls http://${ts_ip}:10100/healthz"
          fi
          main_pid="$(sudo systemctl show -p MainPID --value opencodex-proxy.service)"
          if [[ ! "$main_pid" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::rollback restarted opencodex-proxy.service without a live MainPID"
            exit 1
          fi
          deadline=$((SECONDS + 30))
          while (( SECONDS < deadline )); do
            for url in $urls; do
              remaining=$((deadline - SECONDS))
              (( remaining > 0 )) || break 2
              max_time=$((remaining < 2 ? remaining : 2))
              body="$(curl -fsS --max-time "$max_time" "$url" || true)"
              if HEALTH_BODY="$body" MAIN_PID="$main_pid" python3 -c 'import json, os; b=json.loads(os.environ["HEALTH_BODY"]); raise SystemExit(0 if b.get("status") == "ok" and b.get("service") == "opencodex" and str(b.get("pid")) == os.environ["MAIN_PID"] else 1)' 2>/dev/null; then
                root_url="${url%/healthz}/"
                dashboard="$(curl -fsS --max-time "$max_time" "$root_url" || true)"
                if printf '%s' "$dashboard" | grep -Fq '<title>opencodex · proxy dashboard</title>'; then
                  echo "rolled back to ${{ steps.prev.outputs.sha }} and identity-verified healthy with GUI via $url (pid=$main_pid)"
                  exit 0
                fi
              fi
            done
            (( SECONDS < deadline )) && sleep 1
          done
          echo "::error::rollback deployed ${{ steps.prev.outputs.sha }} but service was not identity-verified healthy within 30s with GUI"
          exit 1
