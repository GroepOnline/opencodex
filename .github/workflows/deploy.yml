name: Deploy to chef-control-az-01

# Rolls a new opencodex version out to the live proxy on chef-control-az-01
# from an immutable GHCR digest (not a git-pull + host Bun build).
#
# Triggers:
#   - push of a `v*.*.*` tag  -> deploy that exact version (the "new version" path)
#   - workflow_dispatch       -> deploy a tag ref deliberately (the "after merge" path)
#
# The job runs on the self-hosted `deploy` runner, which is the Azure control host
# itself, so it can manage its own systemd service (chef has NOPASSWD sudo) and
# health-gate the result locally. No SSH keys cross hosts.
#
# Requires the runner to be registered on chef-control-az-01 (ocx-deploy-runner.service).
# Runtime is Docker Compose under COMPOSE_DIR with a digest-pinned image from GHCR.
# Historical UpCloud chef-control-01 runner is retired.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to deploy (e.g. v1.2.1). Must be an existing tag and must sit on origin/main."
        required: false
        default: ""

permissions:
  contents: read
  packages: read # GHCR digest pull
  actions: read # gh run list/view container.yml publish

concurrency:
  group: ocx-deploy-az-01
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, deploy]
    timeout-minutes: 30
    env:
      COMPOSE_DIR: /opt/chef/deploy/opencodex
      STATE_DIR: /opt/chef/state/opencodex
      COMPOSE_ENV: /opt/chef/deploy/opencodex/.env
    steps:
      - name: Resolve deploy tag
        id: ref
        # The dispatch ref is delivered via an env var (not inline `${{ }}` interpolation)
        # so it is treated as data. Inline interpolation would let a value like
        # `v1.2.3$(whoami)` be command-substituted by the shell *before* the shape
        # guard below runs — an injection on the production deploy host.
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_REF" ]; then
            tag="$INPUT_REF"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            echo "::error::no tag resolved for deploy (ref=${GITHUB_REF})"
            exit 1
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-preview\.[0-9]+)?$ ]]; then
            echo "::error::ref '$tag' is not a valid deploy tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag is on origin/main
        id: verify
        run: |
          set -euo pipefail
          tag="${{ steps.ref.outputs.tag }}"
          git fetch --force --tags origin
          if ! git merge-base --is-ancestor "refs/tags/$tag" "origin/main"; then
            echo "::error::tag $tag is not on origin/main — refusing to deploy an unmerged ref"
            exit 1
          fi
          tag_sha=$(git rev-parse "refs/tags/$tag^{}")
          echo "tag_sha=$tag_sha" >> "$GITHUB_OUTPUT"
          echo "$tag is on origin/main ($tag_sha)"

      # Manifests (compose/unit) must come from the peeled commit, not the
      # mutable tag name. A force-moved tag between the first checkout and
      # fetch --tags would otherwise copy files from A while the image is B.
      - name: Checkout peeled tag commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.verify.outputs.tag_sha }}

      - name: Capture pre-deploy runtime state (for rollback)
        id: prev
        run: |
          set -euo pipefail
          prev_image=""
          if [ -f "$COMPOSE_ENV" ]; then
            prev_image="$(grep -E '^OPENCODEX_IMAGE=' "$COMPOSE_ENV" | head -n1 | cut -d= -f2- || true)"
          fi
          if [ -z "$prev_image" ]; then
            running_id="$(sudo docker ps --filter 'name=opencodex' --format '{{.ID}}' 2>/dev/null | head -n1 || true)"
            if [ -n "$running_id" ]; then
              image_id="$(sudo docker inspect --format='{{.Image}}' "$running_id" 2>/dev/null || true)"
              if [ -n "$image_id" ]; then
                prev_image="$(sudo docker image inspect --format='{{index .RepoDigests 0}}' "$image_id" 2>/dev/null || true)"
              fi
            fi
          fi
          bun_runtime=false
          if sudo systemctl is-active --quiet opencodex-proxy.service 2>/dev/null; then
            exec_line="$(sudo systemctl show -p ExecStart --value opencodex-proxy.service 2>/dev/null || true)"
            if printf '%s' "$exec_line" | grep -qE '(^|[[:space:]/])(bun|node)([[:space:]]|$)'; then
              bun_runtime=true
            fi
          fi
          unit_backup=""
          if [ -f /etc/systemd/system/opencodex-proxy.service ]; then
            unit_backup="${GITHUB_WORKSPACE}/.opencodex-proxy.service.bak"
            sudo cp /etc/systemd/system/opencodex-proxy.service "$unit_backup"
            sudo chown "$(id -un):$(id -gn)" "$unit_backup"
          fi
          # Capture the health/exposure contract of the runtime that rollback
          # would restore. Do not reuse the candidate container topology.
          prev_health_urls=""
          # Tailscale discovery and health can blip independently. Resolve the
          # address with a short bounded retry before snapshotting rollback
          # endpoints, then retry each endpoint before declaring it unhealthy.
          ts_ip=""
          discovery_deadline=$((SECONDS + 10))
          while (( SECONDS < discovery_deadline )); do
            ts_ip="$(tailscale ip -4 2>/dev/null | head -n1 || true)"
            if [[ "$ts_ip" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] && [ "$ts_ip" != "127.0.0.1" ]; then
              break
            fi
            sleep 1
          done
          if [[ ! "$ts_ip" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "$ts_ip" = "127.0.0.1" ]; then
            echo "::error::no discoverable Tailscale IPv4 while capturing pre-deploy health"
            exit 1
          fi
          probe_urls=("http://127.0.0.1:10100/healthz" "http://${ts_ip}:10100/healthz")
          for url in "${probe_urls[@]}"; do
            for attempt in 1 2 3 4 5; do
              body="$(curl -fsS --max-time 2 "$url" || true)"
              if HEALTH_BODY="$body" python3 -c 'import json, os; b=json.loads(os.environ["HEALTH_BODY"]); raise SystemExit(0 if b.get("status") == "ok" and b.get("service") == "opencodex" else 1)' 2>/dev/null; then
                root_url="${url%/healthz}/"
                dashboard="$(curl -fsS --max-time 2 "$root_url" || true)"
                if printf '%s' "$dashboard" | grep -Fq '<title>opencodex · proxy dashboard</title>'; then
                  prev_health_urls="${prev_health_urls}${prev_health_urls:+ }${url}"
                  break
                fi
              fi
              [ "$attempt" -lt 5 ] && sleep 1
            done
          done
          if [ "$bun_runtime" = "true" ] && [ -z "$prev_health_urls" ]; then
            echo "::error::bun runtime is active but no healthy pre-deploy endpoint was captured"
            exit 1
          fi
          echo "pre-deploy health urls: ${prev_health_urls:-none}"
          {
            echo "image=${prev_image}"
            echo "bun_runtime=${bun_runtime}"
            echo "unit_backup=${unit_backup}"
            echo "health_urls=${prev_health_urls}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve health URLs
        run: |
          set -euo pipefail
          urls="http://127.0.0.1:10100/healthz"
          ts_ip="$(tailscale ip -4 2>/dev/null | head -n1 || true)"
          if [[ ! "$ts_ip" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "$ts_ip" = "127.0.0.1" ]; then
            echo "::error::chef-control-az-01 has no discoverable Tailscale IPv4; refusing deploy before runtime cutover"
            exit 1
          fi
          # Host publish must include the Tailscale IPv4. ocx-tunnel and the
          # Cloudflare origin reach :10100 on that address, not on loopback.
          urls="$urls http://${ts_ip}:10100/healthz"
          echo "OPENCODEX_BIND_IP=$ts_ip" >> "$GITHUB_ENV"
          echo "OCX_HEALTH_URLS=$urls" >> "$GITHUB_ENV"

      - name: Wait for GHCR publish (container.yml)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag_sha="${{ steps.verify.outputs.tag_sha }}"
          deadline=$((SECONDS + 900))
          while (( SECONDS < deadline )); do
            ids="$(gh run list --workflow container.yml --commit "$tag_sha" --limit 20 --json databaseId,createdAt --jq 'sort_by(.createdAt) | reverse | .[].databaseId')"
            decided=""
            for id in $ids; do
              pub="$(gh run view "$id" --json jobs --jq '[.jobs[] | select(.name=="publish")] | if length == 0 then "missing" else (.[0].conclusion // "pending") end')"
              case "$pub" in
                skipped|missing)
                  continue
                  ;;
                success)
                  echo "container.yml publish job succeeded on run ${id} for ${tag_sha}"
                  exit 0
                  ;;
                failure|cancelled|timed_out)
                  echo "::error::newest container.yml publish job is ${pub} for ${tag_sha} (run ${id})"
                  gh run list --workflow container.yml --commit "$tag_sha" --limit 5 || true
                  exit 1
                  ;;
                *)
                  decided=pending
                  echo "waiting for container.yml publish job on run ${id} (${pub})..."
                  break
                  ;;
              esac
            done
            if [ -z "$decided" ]; then
              echo "waiting for container.yml publish job on ${tag_sha}..."
            fi
            sleep 15
          done
          echo "::error::no successful container.yml publish job for ${tag_sha} within 15m"
          gh run list --workflow container.yml --commit "$tag_sha" --limit 5 || true
          exit 1

      # chef on az-01 is not in the docker group; login-action talks to the
      # unprivileged socket and cannot pull. Pipe the token to sudo docker.
      - name: Log in to GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Resolve immutable image digest
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          TAG_SHA: ${{ steps.verify.outputs.tag_sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          ref="${image}:${TAG_SHA}"
          sudo docker pull "$ref"
          digest_ref="$(sudo docker image inspect --format='{{index .RepoDigests 0}}' "$ref")"
          if [[ ! "$digest_ref" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::could not resolve immutable digest for ${ref}"
            exit 1
          fi
          echo "ref=${digest_ref}" >> "$GITHUB_OUTPUT"
          echo "pinned ${digest_ref}"

      - name: Deploy digest-pinned container (in-place cutover)
        id: deploy
        env:
          TAG_SHA: ${{ steps.verify.outputs.tag_sha }}
          PINNED_IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          if [[ ! "$OPENCODEX_BIND_IP" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "$OPENCODEX_BIND_IP" = "127.0.0.1" ]; then
            echo "::error::OPENCODEX_BIND_IP must be the host Tailscale IPv4 (got '${OPENCODEX_BIND_IP:-empty}')"
            exit 1
          fi
          token_file="${OPENCODEX_API_TOKEN_FILE:-/etc/chef/opencodex/service-api-token}"
          if [ ! -f "$token_file" ]; then
            echo "::error::runtime API token file missing at ${token_file} (set OPENCODEX_API_TOKEN_FILE on the host)"
            exit 1
          fi
          echo "api_token_file=${token_file} (sha256:$(sudo sha256sum "$token_file" | awk '{print substr($1,1,12)}'))"

          # Resolve the candidate runtime uid/gid from the pinned image without
          # running its entrypoint or granting network/write access.
          container_uid="$(sudo docker run --rm --network none --read-only --entrypoint /usr/bin/id "$PINNED_IMAGE" -u)"
          container_gid="$(sudo docker run --rm --network none --read-only --entrypoint /usr/bin/id "$PINNED_IMAGE" -g)"
          if [[ ! "$container_uid" =~ ^[0-9]+$ ]] || [[ ! "$container_gid" =~ ^[0-9]+$ ]]; then
            echo "::error::could not resolve numeric container uid/gid"
            exit 1
          fi
          echo "container runtime uid:gid=${container_uid}:${container_gid}"

          # Arm rollback before any persistent unit/.env mutation or service stop.
          echo "cutover_started=true" >> "$GITHUB_OUTPUT"

          sudo mkdir -p "$COMPOSE_DIR" "$STATE_DIR"

          # Quiesce the current runtime before copying OAuth/config state.
          sudo systemctl stop opencodex-proxy.service || true
          if sudo systemctl is-active --quiet opencodex-proxy.service; then
            echo "::error::opencodex-proxy.service remained active after stop"
            exit 1
          fi

          # Drop leftover compose units from a prior partial cutover.
          if [ -f "$COMPOSE_DIR/docker-compose.yml" ]; then
            sudo docker compose --env-file "$COMPOSE_ENV" -f "$COMPOSE_DIR/docker-compose.yml" down || true
          fi
          sudo docker rm -f opencodex-opencodex-1 2>/dev/null || true

          # Live bun listens on the Tailscale IPv4, not loopback. Compose
          # publishes both; starting it while that listener is up is EADDRINUSE.
          deadline=$((SECONDS + 20))
          while (( SECONDS < deadline )); do
            if ! sudo ss -ltn | awk '$4 ~ /:10100$/ { found=1 } END { exit !found }'; then
              break
            fi
            sleep 1
          done
          if sudo ss -ltn | awk '$4 ~ /:10100$/ { found=1 } END { exit !found }'; then
            echo "::error::port 10100 still bound after stopping opencodex-proxy.service"
            sudo ss -ltnp | awk '$4 ~ /:10100$/ { print }' || true
            exit 1
          fi

          # Carry the live Bun runtime state forward without overwriting
          # container-owned state from a previous deploy.
          if [ -d /home/chef/.opencodex ]; then
            sudo rsync -a --ignore-existing /home/chef/.opencodex/ "$STATE_DIR"
          fi
          # The carried bun-runtime config pins hostname to the host Tailscale
          # IPv4, which does not exist inside the bridge network; the container
          # then refuses to bind (PortUnavailableError, exit 1 crash-loop).
          # Strip it so the container binds 0.0.0.0 via OPENCODEX_BIND_HOST
          # and keeps the rest of the carried settings. Inline (not a repo
          # file): the deploy job checks out the deployed tag, so any script
          # the workflow needs must already exist in that tag.
          if sudo test -f "$STATE_DIR/config.json"; then
            sudo python3 -c 'import json,os,sys; p=sys.argv[1]; d=json.load(open(p,encoding="utf-8")); del d["hostname"]; json.dump(d,open(p+".t","w",encoding="utf-8"),indent=2); os.chmod(p+".t",0o600); os.replace(p+".t",p); print("stripped hostname from carried config")' "$STATE_DIR/config.json" 2>/dev/null || true
          fi
          sudo chown -R "$container_uid:$container_gid" "$STATE_DIR"
          sudo cp deploy/container/compose.example.yml "$COMPOSE_DIR/docker-compose.yml"
          sudo cp deploy/container/opencodex-proxy.service /etc/systemd/system/opencodex-proxy.service

          {
            printf 'OPENCODEX_IMAGE=%s\n' "$PINNED_IMAGE"
            printf 'CF_ACCESS_TEAM_DOMAIN=%s\n' 'chefgroep.cloudflareaccess.com'
            printf 'CF_ACCESS_AUD=%s\n' '113d678ff9b96cabf41e8e2076166fa692bc078db28e792019c9302fa0e53286'
            printf 'CF_ACCESS_ALLOWED_HOSTS=%s\n' 'ocx.chefgroep.online'
            printf 'OPENCODEX_STATE_DIR=%s\n' "$STATE_DIR"
            printf 'OPENCODEX_API_TOKEN_FILE=%s\n' "$token_file"
            printf 'OPENCODEX_BIND_IP=%s\n' "$OPENCODEX_BIND_IP"
          } | sudo tee "$COMPOSE_ENV" > /dev/null

          # The container reads the API token via a compose file-secret bind
          # mount, which preserves the host file's mode. The host file is
          # 0640 root:chef, but the container runs as bun (uid 1000); the
          # entrypoint exits 78 when the token is unreadable (observed
          # crash-loop). Grant world-read now; root keeps write for rotation.
          sudo chmod 0644 "$token_file"
          sudo systemctl daemon-reload
          sudo systemctl enable opencodex-proxy.service
          sudo systemctl start opencodex-proxy.service
          echo "deployed_image=${PINNED_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Health gate
        id: health
        env:
          TAG_SHA: ${{ steps.verify.outputs.tag_sha }}
        run: |
          set -euo pipefail
          read -r -a health_urls <<< "$OCX_HEALTH_URLS"
          if [ "${#health_urls[@]}" -lt 2 ]; then
            echo "::error::OCX_HEALTH_URLS must include loopback and Tailscale"
            exit 1
          fi
          deadline=$((SECONDS + 60))
          attempt=0
          while (( SECONDS < deadline )); do
            attempt=$((attempt + 1))
            remaining=$((deadline - SECONDS))
            (( remaining > 0 )) || break
            max_time=$((remaining < 2 ? remaining : 2))
            all_ok=1
            for url in "${health_urls[@]}"; do
              body="$(curl -fsS --max-time "$max_time" "$url" || true)"
              if ! HEALTH_BODY="$body" TAG_SHA="$TAG_SHA" python3 -c 'import json, os; b=json.loads(os.environ["HEALTH_BODY"]); raise SystemExit(0 if b.get("status") == "ok" and b.get("service") == "opencodex" and b.get("gitSha") == os.environ["TAG_SHA"] else 1)' 2>/dev/null; then
                all_ok=0
                break
              fi
              root_url="${url%/healthz}/"
              dashboard="$(curl -fsS --max-time "$max_time" "$root_url" || true)"
              if ! printf '%s' "$dashboard" | grep -Fq '<title>opencodex · proxy dashboard</title>'; then
                all_ok=0
                break
              fi
            done
            if [ "$all_ok" = 1 ]; then
              echo "healthy after ${attempt} tries via ${OCX_HEALTH_URLS} (gitSha=${TAG_SHA})"
              echo "status=ok" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            (( SECONDS < deadline )) && sleep 1
          done
          echo "::error::opencodex did not become gitSha-verified healthy within 60s with GUI after cutover"
          sudo docker inspect opencodex-opencodex-1 --format 'Status={{.State.Status}} Exit={{.State.ExitCode}} Error={{.State.Error}}' 2>/dev/null || true
          sudo ss -ltnp | awk '$4 ~ /:10100$/ { print }' || true
          exit 1

      - name: Rollback on failure
        # failure() does not fire on job timeout/cancellation. A timed-out
        # cutover would otherwise leave the host half-updated with no rollback.
        if: (failure() || cancelled()) && steps.prev.outcome == 'success' && steps.deploy.outputs.cutover_started == 'true'
        env:
          TAG_SHA: ${{ steps.verify.outputs.tag_sha }}
          PREV_IMAGE: ${{ steps.prev.outputs.image }}
          BUN_RUNTIME: ${{ steps.prev.outputs.bun_runtime }}
          UNIT_BACKUP: ${{ steps.prev.outputs.unit_backup }}
          PREV_HEALTH_URLS: ${{ steps.prev.outputs.health_urls }}
        run: |
          set -euo pipefail
          prev_image="$PREV_IMAGE"
          bun_runtime="$BUN_RUNTIME"
          unit_backup="$UNIT_BACKUP"
          # Live bun wins over a leftover compose OPENCODEX_IMAGE from a prior
          # partial cutover. Restoring that digest would skip the bun unit.
          if [ "$bun_runtime" = "true" ] && [ -z "$unit_backup" ]; then
            echo "::error::bun runtime detected but unit backup missing"
            exit 1
          fi

          # Mirror deploy cleanup: a leftover compose unit holding the
          # Tailscale listener makes bun restart fail the same EADDRINUSE way.
          if [ -f "$COMPOSE_DIR/docker-compose.yml" ]; then
            sudo docker compose --env-file "$COMPOSE_ENV" -f "$COMPOSE_DIR/docker-compose.yml" down || true
          fi
          sudo docker rm -f opencodex-opencodex-1 2>/dev/null || true
          deadline=$((SECONDS + 20))
          while (( SECONDS < deadline )); do
            if ! sudo ss -ltn | awk '$4 ~ /:10100$/ { found=1 } END { exit !found }'; then
              break
            fi
            sleep 1
          done
          if sudo ss -ltn | awk '$4 ~ /:10100$/ { found=1 } END { exit !found }'; then
            echo "::error::port 10100 still bound before restoring the previous runtime"
            sudo ss -ltnp | awk '$4 ~ /:10100$/ { print }' || true
            exit 1
          fi

          if [ "$bun_runtime" = "true" ]; then
            sudo cp "$unit_backup" /etc/systemd/system/opencodex-proxy.service
            sudo systemctl daemon-reload
            sudo systemctl enable opencodex-proxy.service
            sudo systemctl restart opencodex-proxy.service
          elif [ -n "$prev_image" ]; then
            # A prior image may run as a different uid/gid than the candidate.
            # Restore state ownership to that image before starting it.
            sudo docker image inspect "$prev_image" >/dev/null 2>&1 || sudo docker pull "$prev_image" >/dev/null
            prev_uid="$(sudo docker run --rm --network none --read-only --entrypoint /usr/bin/id "$prev_image" -u)"
            prev_gid="$(sudo docker run --rm --network none --read-only --entrypoint /usr/bin/id "$prev_image" -g)"
            if [[ ! "$prev_uid" =~ ^[0-9]+$ ]] || [[ ! "$prev_gid" =~ ^[0-9]+$ ]]; then
              echo "::error::could not resolve previous container uid/gid for rollback"
              exit 1
            fi
            sudo chown -R "$prev_uid:$prev_gid" "$STATE_DIR"
            token_file="${OPENCODEX_API_TOKEN_FILE:-/etc/chef/opencodex/service-api-token}"
            {
              printf 'OPENCODEX_IMAGE=%s\n' "$prev_image"
              printf 'CF_ACCESS_TEAM_DOMAIN=%s\n' 'chefgroep.cloudflareaccess.com'
              printf 'CF_ACCESS_AUD=%s\n' '113d678ff9b96cabf41e8e2076166fa692bc078db28e792019c9302fa0e53286'
              printf 'CF_ACCESS_ALLOWED_HOSTS=%s\n' 'ocx.chefgroep.online'
              printf 'OPENCODEX_STATE_DIR=%s\n' "$STATE_DIR"
              printf 'OPENCODEX_API_TOKEN_FILE=%s\n' "$token_file"
              printf 'OPENCODEX_BIND_IP=%s\n' "$OPENCODEX_BIND_IP"
            } | sudo tee "$COMPOSE_ENV" > /dev/null
            sudo systemctl restart opencodex-proxy.service
          else
            echo "::error::no previous digest and no bun runtime to roll back to"
            exit 1
          fi

          urls="$PREV_HEALTH_URLS"
          if [ -z "$urls" ]; then
            echo "::error::no pre-deploy healthy endpoint was captured for rollback verification"
            exit 1
          fi
          read -r -a rollback_urls <<< "$urls"
          deadline=$((SECONDS + 30))
          while (( SECONDS < deadline )); do
            remaining=$((deadline - SECONDS))
            (( remaining > 0 )) || break
            max_time=$((remaining < 2 ? remaining : 2))
            all_ok=1
            for url in "${rollback_urls[@]}"; do
              body="$(curl -fsS --max-time "$max_time" "$url" || true)"
              if HEALTH_BODY="$body" python3 -c 'import json, os; b=json.loads(os.environ["HEALTH_BODY"]); raise SystemExit(0 if b.get("status") == "ok" and b.get("service") == "opencodex" else 1)' 2>/dev/null; then
                root_url="${url%/healthz}/"
                dashboard="$(curl -fsS --max-time "$max_time" "$root_url" || true)"
                if printf '%s' "$dashboard" | grep -Fq '<title>opencodex · proxy dashboard</title>'; then
                  continue
                fi
              fi
              all_ok=0
              break
            done
            if [ "$all_ok" = 1 ]; then
              echo "rolled back and healthy with GUI via $urls"
              exit 0
            fi
            (( SECONDS < deadline )) && sleep 1
          done
          echo "::error::rollback did not restore a healthy service within 30s with GUI"
          exit 1

      - name: Log out of GHCR
        if: always()
        run: sudo docker logout ghcr.io || true
