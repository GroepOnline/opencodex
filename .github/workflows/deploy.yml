name: Legacy deploy route retired

# The previous production Docker/GHCR deployment route is permanently retired.
# It must never be selected by a tag push or manual release dispatch. Production
# runtime cutover is owned by a private deployment contract with an explicit
# target, immutable artifact identity, health proof and rollback evidence.
#
# Keeping this small, explicit workflow provides a clear audit result for an
# accidental legacy dispatch without retaining credentials, host paths, or any
# deploy side effects in the repository.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse retired deployment route
        run: |
          echo "::error::The previous production deployment route is permanently retired."
          echo "::error::Do not deploy this workflow; use the separately verified private production deployment contract."
          exit 1
