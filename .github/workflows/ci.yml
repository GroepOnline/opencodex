name: Cross-platform CI

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "src/**"
      - "bin/**"
      - "tests/**"
      - "scripts/**"
      - "gui/**"
      - ".gitattributes"
      - ".npmignore"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/enforce-pr-target.yml"
      - ".github/workflows/stale-needs-info.yml"
      - ".github/workflows/issue-triage.yml"
      - ".github/workflows/publish-on-tag.yml"
  push:
    branches: [main, preview, dev]
    paths:
      - "src/**"
      - "bin/**"
      - "tests/**"
      - "scripts/**"
      - "gui/**"
      - ".gitattributes"
      - ".npmignore"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/enforce-pr-target.yml"
      - ".github/workflows/stale-needs-info.yml"
      - ".github/workflows/issue-triage.yml"
      - ".github/workflows/publish-on-tag.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Keep the 20-minute ceiling as a real performance boundary. The combined provider-security
    # and admission suites pushed the serial macOS/Windows jobs into this ceiling even though the
    # root tests themselves remained green. Slow platforms therefore separate root tests from GUI
    # quality work, and Windows root tests are deterministically balanced over two shards.
    # ponytail: Linux-only on push/PR (saves macOS 10x / Windows 2x minutes); full matrix on release tags.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ startsWith(github.ref, 'refs/tags/v')
          && fromJSON('[{"name":"ubuntu-latest","os":"ubuntu-latest","run_tests":true,"run_quality":true,"run_typecheck":true,"shard_index":0,"shard_count":1},{"name":"macos-latest","os":"macos-latest","run_tests":true,"run_quality":false,"run_typecheck":true,"shard_index":0,"shard_count":1},{"name":"macos-quality","os":"macos-latest","run_tests":false,"run_quality":true,"run_typecheck":false,"shard_index":0,"shard_count":1},{"name":"windows-latest","os":"windows-latest","run_tests":true,"run_quality":false,"run_typecheck":true,"shard_index":0,"shard_count":2},{"name":"windows-latest shard 2/2","os":"windows-latest","run_tests":true,"run_quality":false,"run_typecheck":false,"shard_index":1,"shard_count":2},{"name":"windows-quality","os":"windows-latest","run_tests":false,"run_quality":true,"run_typecheck":false,"shard_index":0,"shard_count":1}]')
          || fromJSON('[{"name":"ubuntu-latest","os":"ubuntu-latest","run_tests":true,"run_quality":true,"run_typecheck":true,"shard_index":0,"shard_count":1}]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
          cache: true
          cache-bin: true

      - name: Cache GUI node_modules
        if: ${{ matrix.run_quality || matrix.run_tests }}
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: gui/node_modules
          key: gui-node-modules-${{ hashFiles('gui/bun.lock') }}
          restore-keys: |
            gui-node-modules-

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install GUI dependencies
        # Root tests need gui/node_modules too: several tests/ suites import GUI components
        # (e.g. provider-workspace rail, quota bars), which resolve react from gui/.
        if: ${{ matrix.run_quality || matrix.run_tests }}
        run: cd gui && bun install --frozen-lockfile

      - name: Typecheck
        if: ${{ matrix.run_typecheck }}
        run: bun x tsc --noEmit

      - name: Test
        if: ${{ matrix.run_tests }}
        shell: bash
        env:
          MATRIX_OS: ${{ matrix.os }}
          TEST_SHARD_INDEX: ${{ matrix.shard_index }}
          TEST_SHARD_COUNT: ${{ matrix.shard_count }}
        run: |
          set -euo pipefail
          run_suite() {
            if [[ "$TEST_SHARD_COUNT" == "1" ]]; then
              bun run scripts/test.ts
            else
              bun run scripts/ci-test-shard.ts "$TEST_SHARD_INDEX" "$TEST_SHARD_COUNT"
            fi
          }

          if [[ "$MATRIX_OS" != "windows-latest" ]]; then
            run_suite
            exit 0
          fi

          # Bun 1.3.14 on Windows intermittently panics under Worker spawn/terminate churn in
          # storage policy tests ("Internal assertion failure" / "Bun has crashed"). Retry the
          # current shard once on that runtime crash only; ordinary assertion failures still fail.
          out="$(mktemp)"
          set +e
          run_suite >"$out" 2>&1
          code=$?
          set -e
          cat "$out"
          if [[ $code -eq 0 ]]; then
            exit 0
          fi
          if grep -q 'Bun has crashed' "$out"; then
            echo "::warning::Bun runtime crash on Windows shard; retrying once"
            run_suite
            exit $?
          fi
          exit "$code"

      - name: GUI tests
        if: ${{ matrix.run_quality }}
        run: cd gui && bun test tests --isolate

      - name: Privacy scan
        if: ${{ matrix.run_quality }}
        run: bun run privacy:scan

      - name: Check release helper syntax
        if: ${{ matrix.run_quality }}
        run: bun build scripts/release.ts --target=bun --outdir=.tmp/ci-release-script-check

      - name: GUI lint
        if: ${{ matrix.run_quality }}
        run: |
          cd gui
          bun run lint

      - name: GUI build
        if: ${{ matrix.run_quality }}
        run: |
          cd gui
          bun run build

      - name: CLI help smoke
        if: ${{ matrix.run_quality }}
        run: bun run src/cli/index.ts help

  npm-global-smoke:
    name: npm-global ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    # ponytail: Linux-only on push/PR; full OS matrix on release tags (matrix.os below is conditional).
    strategy:
      fail-fast: false
      matrix:
        os: ${{ startsWith(github.ref, 'refs/tags/v') && fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # Deliberately NO setup-bun: prove `npm install -g` works without a
      # separately-installed Bun. The launcher uses the bundled `bun` dependency.
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20

      - name: Install package dependencies
        run: npm install

      - name: Build package assets
        run: npm run build:gui

      - name: Pack
        shell: bash
        run: npm pack --json > pack.json

      - name: Verify packed GUI asset
        run: node -e "const p=require('./pack.json')[0]; if (!p.files.some(f => f.path === 'gui/dist/index.html')) { console.error('missing gui/dist/index.html in npm pack'); process.exit(1); }"

      - name: Install globally (downloads bundled bun)
        shell: bash
        run: npm install -g ./groeponline-opencodex-*.tgz

      - name: ocx help via bundled bun
        run: ocx help

  security:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install GUI dependencies
        working-directory: gui
        run: bun install --frozen-lockfile

      - name: Generate Bun audit report
        id: bun-audit
        continue-on-error: true
        shell: bash
        run: |
          set +e
          # Full JSON evidence: `bun audit --json` ignores --audit-level, so this
          # captures findings at every severity for the uploaded artifact.
          bun audit --json > bun-audit.json
          # Gate decision: bun audit only honors --audit-level in non-JSON mode,
          # so derive the pass/fail from the human-readable run (high/critical only).
          bun audit --audit-level=high
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Generate GUI Bun audit report
        id: gui-bun-audit
        continue-on-error: true
        working-directory: gui
        shell: bash
        run: |
          set +e
          bun audit --json > bun-audit.json
          bun audit --audit-level=high
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Bun audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bun-audit
          path: bun-audit.json
          retention-days: 7

      - name: Upload GUI Bun audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gui-bun-audit
          path: gui/bun-audit.json
          retention-days: 7

      - name: Enforce Bun audit
        if: steps.bun-audit.outputs.exit_code != '0' || steps.gui-bun-audit.outputs.exit_code != '0'
        run: |
          echo "== root bun-audit.json =="
          cat bun-audit.json || true
          echo "== gui/bun-audit.json =="
          cat gui/bun-audit.json || true
          exit 1

  lint-github-actions:
    name: Lint GitHub Actions
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Lint workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

      - name: Lint YAML
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3.1.1
        with:
          config_file: .yamllint.yml
